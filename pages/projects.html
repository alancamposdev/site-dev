<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
      integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/style.css" />

    <script type="module" src="../js/components/Footer.js"></script>
    <script src="../js/main.js" defer></script>
  </head>
  <body>
    <header class="header" id="header">
      <nav class="nav container">
        <a href="/" class="nav__logo" aria-label="ACode — ir para home">
          <svg
            viewBox="0 0 36 36"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <!-- Outer rounded square -->
            <rect
              width="36"
              height="36"
              rx="9"
              fill="#00ff88"
              fill-opacity="0.12"
            />
            <!-- Left bracket -->
            <path
              d="M14 10 L9 18 L14 26"
              stroke="#00ff88"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Right bracket -->
            <path
              d="M22 10 L27 18 L22 26"
              stroke="#00cc6a"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Slash in center -->
            <line
              x1="20"
              y1="11"
              x2="16"
              y2="25"
              stroke="#00ff88"
              stroke-width="2"
              stroke-linecap="round"
              opacity="0.7"
            />
          </svg>
          <span class="nav__logo-text">A-Code</span>
        </a>

        <!-- ── Nav menu / Mobile drawer (center on desktop) ── -->
        <div
          class="nav__menu"
          id="nav-menu"
          role="navigation"
          aria-label="Menu principal"
        >
          <div class="nav__drawer-inner">
            <ul class="nav__list">
              <li class="nav__item"><a href="../index.html">Início</a></li>
              <li class="nav__item">
                <a href="./about.html">Sobre</a>
              </li>
              <li class="nav__item">
                <a href="./contact.html">Contato</a>
              </li>
              <li class="nav__item">
                <a href="./projects.html">Projetos</a>
              </li>
            </ul>

            <!-- Mobile-only: login / register buttons at bottom of drawer -->
            <div class="nav__drawer-footer">
              <a
                href="../pages/login.html"
                class="nav__drawer-btn nav__drawer-btn--login"
              >
                <i class="ri-login-box-line"></i> Entrar
              </a>
              <a
                href="../pages/register.html"
                class="nav__drawer-btn nav__drawer-btn--register"
              >
                <i class="ri-user-add-line"></i> Criar conta
              </a>
            </div>
          </div>
        </div>

        <!-- ── Actions (right) ── -->
        <div class="nav__actions">
          <!-- Desktop: details/summary user dropdown -->
          <details class="nav__user-details" id="nav-user-details">
            <summary aria-label="Menu do usuário">
              <span class="nav__user-icon">
                <i class="ri-user-3-line"></i>
              </span>
              <span>Conta</span>
              <i class="ri-arrow-down-s-line nav__user-chevron"></i>
            </summary>
            <div class="nav__user-dropdown">
              <a href="../pages/login.html">
                <i class="ri-login-box-line"></i> Entrar
              </a>
              <div class="nav__dropdown-divider"></div>
              <a href="../pages/register.html">
                <i class="ri-user-add-line"></i> Criar conta
              </a>
            </div>
          </details>

          <!-- Mobile: user icon button -->
          <a
            href="./pages/login.html"
            class="nav__user-btn-mobile nav__toggle"
            aria-label="Entrar"
            style="display: none"
          >
            <i class="ri-user-3-line"></i>
          </a>

          <!-- Mobile: hamburger toggle -->
          <button
            class="nav__toggle"
            id="nav-toggle"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="nav-menu"
          >
            <i class="ri-menu-line"></i>
          </button>
        </div>
        <!-- /nav__actions -->
      </nav>

      <!-- Overlay for mobile drawer -->
      <div class="nav__overlay" id="nav-overlay" aria-hidden="true"></div>

      <!-- Close button (shown inside open drawer on mobile) -->
      <button class="nav__close" id="nav-close" aria-label="Fechar menu">
        <i class="ri-close-line"></i>
      </button>
    </header>
    <main>
      <section>
        <h1>Projects Page</h1>

        <div class="cards">
          <div class="card">Card1</div>
          <div class="card">Card2</div>
          <div class="card">Card3</div>
          <div class="card">Card4</div>
          <div class="card">Card5</div>
          <div class="card">Card6</div>
          <div class="card">Card7</div>
          <div class="card">Card8</div>
          <div class="card">Card9</div>
        </div>
      </section>
    </main>
    <ac-footer></ac-footer>
  </body>
</html>
